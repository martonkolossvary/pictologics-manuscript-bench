schema_version: 1
name: medimage
distribution: medimage-pkg
version: "0.9.8"
python: "3.10"
requirement: "medimage-pkg==0.9.8"
extra_requirements:
  # MEDimage 0.9.8 still calls pandas.DataFrame.append and np.product.
  - "pandas==1.5.3"
  - "numpy==1.26.4"
env_dir: ".venvs/adapters/medimage"
smoke_imports: []
smoke_entrypoints:
  - "bench.adapters.medimage_adapter:_medimage_modules"
upstream: "https://pypi.org/project/medimage-pkg/0.9.8/"
verified_latest_stable: "2026-07-21"
notes: "Compatibility pins are required by the 0.9.8 implementation; pip check remains mandatory. The calculation-free smoke entrypoint loads every MEDimage biomarker module used by the adapter without executing the package-level import, which eagerly loads an unrelated XGBoost learning stack that requires system OpenMP on macOS."
environment_locks:
  Darwin-arm64:
    path: "reproducibility/environment-locks/darwin-arm64/medimage.txt"
    sha256: "b4935aa89d99f4e6d82d5f71a56b0477234ae537069dfa4a2e1d259d65a804ae"
    freeze_sha256: "120acd88dcdd1cb348a83345f0920fa35bf57e4f63bf55b90ce3ed435dad25c4"
