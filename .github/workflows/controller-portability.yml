name: controller-portability

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controller:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Poetry
        run: python -m pip install "poetry>=2.2,<3"
      - name: Install controller
        run: poetry sync
      - name: Validate project metadata
        run: poetry check
      - name: Lint
        run: poetry run ruff check .
      - name: Unit and integration tests
        run: poetry run pytest -q

  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate POSIX launchers
        run: bash -n scripts/*.sh
