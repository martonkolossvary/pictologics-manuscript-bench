name: controller-portability

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controller:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Poetry
        run: python -m pip install "poetry>=2.2,<3"
      - name: Install controller
        run: poetry sync
      - name: Validate project metadata
        run: poetry check
      - name: Lint
        run: poetry run ruff check .
      - name: Unit and integration tests
        run: poetry run pytest -q

  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate POSIX launchers
        run: bash -n scripts/*.sh

  native-adapters:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            interpreters: "3.9 3.10 3.12"
          - os: macos-15
            interpreters: "3.10 3.11 3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PICTOLOGICS_DISABLE_WARMUP: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install controller tools
        run: python -m pip install "poetry>=2.2,<3" "uv==0.8.24"
      - name: Install adapter interpreters
        run: uv python install ${{ matrix.interpreters }}
      - name: Install controller
        run: poetry sync
      - name: Require checked-in locks for the native runner architecture
        run: >-
          poetry run python -c "from bench import env;
          print(env.native_platform_key());
          missing = [p.name for p in env.load_runtime_profiles().values() if env._resolve_environment_lock(p) is None];
          assert not missing, f'No native environment lock for {missing}'"
      - name: Create and verify locked native adapter environments
        run: poetry run python -m bench.cli env create
      - name: Collect complete untimed core qualification and retain review findings
        shell: pwsh
        env:
          NUMBA_CACHE_DIR: ${{ runner.temp }}/numba-cache
        run: |
          poetry run python -m scripts.qualify_release --scope core --output-dir artifacts/release-qualification
          $qualificationExit = $LASTEXITCODE
          if ($qualificationExit -notin 0, 2) { exit $qualificationExit }
          $assessment = Get-Content artifacts/release-qualification/release-qualification.json -Raw | ConvertFrom-Json
          if (-not $assessment.complete) { throw 'Untimed qualification is incomplete' }
          if ($qualificationExit -eq 2) {
            if ($assessment.status -ne 'needs_review') { throw 'Unexpected qualification result' }
            Write-Output '::notice::Untimed diagnostics completed with review findings; inspect release-qualification.json. This job does not certify accuracy or timing readiness.'
          }
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: untimed-qualification-${{ matrix.os }}
          path: artifacts/release-qualification/
